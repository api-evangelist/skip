name: Skip
description: 'Skip (originally Skip Protocol, skip.money) is the interchain infrastructure
  company that rebranded to Cosmos Labs and is now a wholly-owned subsidiary of the
  Interchain Foundation, leading engineering and growth for the Cosmos blockchain
  stack. Its skip.money and skip.build domains now redirect to cosmos.network. The
  team maintains the open-source Cosmos SDK, the Inter-Blockchain Communication protocol
  (IBC), the CometBFT consensus engine, and Cosmos EVM — the most widely adopted Layer
  1 blockchain toolkit, deployed across 200+ chains. There is no independent Skip-branded
  hosted API; the public developer surface is the Cosmos SDK node REST + gRPC interfaces
  documented at docs.cosmos.network, with source on the cosmos GitHub organization.'
